{% extends 'common/base.html' %}

{% block head_title %}Detalle del usuario{% endblock %}

{% block content %}
<h2 class="mb-4">Detalle del usuario</h2>
<dl class="row">
    <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9">{{ object.nombre }}</dd>
    <dt class="col-sm-3">Email</dt><dd class="col-sm-9">{{ object.email }}</dd>
    <dt class="col-sm-3">Rol</dt><dd class="col-sm-9">{{ object.rol }}</dd>
    <dt class="col-sm-3">Fecha de registro</dt><dd class="col-sm-9">{{ object.fecha_registro }}</dd>
</dl>
<a href="{% url 'usuario_list' %}" class="btn btn-secondary">Volver a la lista</a>
{% endblock %}
